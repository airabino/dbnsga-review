[package]
name = "fleet_opt_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "fleet_opt_core"
crate-type = ["cdylib"]
path = "rust_src/lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
numpy = "0.22"
rand = { version = "0.8", features = ["small_rng"] }
indexmap = "2"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
